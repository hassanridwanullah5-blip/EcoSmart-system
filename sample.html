<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family: "Poppins", sans-serif;
            background-color: #f5f5f5;
        }
        .search{
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .search input{
            width: 300px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: green;
            color: white;
            padding-left: 30px;
        }
        .search input::placeholder{
            color: white;
        }
        .search img{
            width: 20px;
            height: 20px;
            margin-right: 19rem;
            position: absolute;
        }
        </style>
</head>
<body>
    <div class="search">
        <img src="./Icons/Can metals.svg" alt="">
        <input type="text" id="location" name="location" list="lagos-locations" placeholder="Enter your area or location" autocomplete="off"  required>
    </div>
    
</body>
</html>
